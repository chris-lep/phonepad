name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: System packages (Xvfb for the XTest tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Node dependencies
        run: npm ci

      - name: Lint and types
        run: make lint

      - name: Unit tests
        run: make test

      - name: End-to-end (headless Chrome)
        run: make e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: XTest typing against Xvfb
        run: make xtest

  python-versions:
    # The runtime claims Python >= 3.11; check the oldest and the newest supported.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - run: pytest
